<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ char_name }} · Access Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/themes/' + (webui_theme or 'default') + '.css') }}?v=7.4" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}?v=7.4">
</head>
<body>
  <div id="vignette"></div>
  <canvas id="c"></canvas>

  <div id="login">
    <div class="panel">
      <div class="c2"></div>
      <div class="logo">{{ char_name }}</div>
      <div class="sub">Access Control Protocol · v4.1</div>
      <div class="status-row">
        <div class="dot" id="dot"></div>
        <div class="status-txt" id="stxt">READY</div>
      </div>
      <div class="divider"><span></span><i>◈</i><span></span></div>
      <form method="POST" action="{{ url_for('login') }}" id="form">
        <label class="lbl" for="pw"><em>//</em> AUTHORIZATION KEY</label>
        <div class="inp-wrap">
          <span class="inp-icon">⬡</span>
          <input type="password" id="pw" name="password" required
            autocomplete="current-password" placeholder="Enter security token">
        </div>
        <button type="submit" class="btn" id="btn">
          <span id="btntxt">INITIALIZE LINK</span>
          <span class="btn-arr">→</span>
          <div class="btn-shine"></div>
        </button>
        {% if error %}
        <div class="err"><span>⚠</span> {{ error }}</div>
        {% endif %}
      </form>
      <div class="footer">
        <span>{{ char_name }}</span>
        <span class="footer-sep">·</span>
        <span id="clk"></span>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
