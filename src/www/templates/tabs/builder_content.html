<div class="body-wrap">
  <!-- Scrollable content -->
  <div class="body-scroll">

    <!-- Live mode toggle bar (matches body-speed pattern) -->
    <div class="body-speed">
      <span class="body-speed-label"><i class="bi bi-broadcast"></i> LIVE</span>
      <button class="bld-live-btn" id="bldLiveToggle">OFF</button>
    </div>

    <!-- Two-column layout -->
    <div class="body-sides">
      <!-- LEFT: Steps -->
      <div class="body-side">
        <div class="body-panel bld-panel-steps">
          <div class="body-panel-label">STEPS
            <span class="bld-legend">
              <span><b>LH</b> L height</span>
              <span><b>RH</b> R height</span>
              <span><b>LL</b> L leg</span>
              <span><b>RL</b> R leg</span>
            </span>
          </div>
          <div class="bld-step-list" id="bldStepList"></div>
          <div class="bld-add-bar">
            <button class="hud-btn hud-btn-secondary bld-add-btn" id="bldAddPosition"><i class="bi bi-plus"></i> Position</button>
          </div>
        </div>
      </div>

      <!-- RIGHT: Preview + Import + Save + Saved -->
      <div class="body-side">
        <div class="body-panel bld-panel-preview">
          <div class="body-panel-label">PREVIEW</div>
          <div class="bld-preview-viewport" id="bldPreviewViewport"></div>
          <div class="bld-preview-controls">
            <button class="hud-btn hud-btn-secondary" id="bldPreview"><i class="bi bi-play-fill"></i> Preview</button>
            <button class="hud-btn hud-btn-secondary" id="bldPreviewStop" style="display:none"><i class="bi bi-stop-fill"></i> Stop</button>
          </div>
        </div>
        <div class="body-panel">
          <div class="body-panel-label">IMPORT</div>
          <div class="bld-movement-add">
            <select id="bldMovementSelect" class="hud-select bld-movement-sel">
              <option value="">Loading…</option>
            </select>
            <button class="hud-btn hud-btn-secondary" id="bldAddMovement" title="Append as named movement step"><i class="bi bi-lightning-fill"></i></button>
            <button class="hud-btn hud-btn-secondary" id="bldImportMovement" title="Import as editable position steps"><i class="bi bi-download"></i></button>
          </div>
        </div>
        <div class="body-panel">
          <div class="body-panel-label">SAVE</div>
          <div class="bld-save-row">
            <input type="text" id="bldSeqName" class="form-control form-control-sm config-input bld-name-input" placeholder="Sequence name">
            <button class="hud-btn hud-btn-primary" id="bldSave"><i class="bi bi-save"></i></button>
            <button class="hud-btn hud-btn-secondary" id="bldClear" title="Clear all steps"><i class="bi bi-trash3"></i></button>
          </div>
          <div class="bld-overwrite-confirm" id="bldOverwriteConfirm" style="display:none">
            <span class="bld-confirm-msg"></span>
            <button class="hud-btn hud-btn-danger" id="bldOverwriteReplace">Replace</button>
            <button class="hud-btn" id="bldOverwriteCancel">Cancel</button>
          </div>
          <div class="bld-feedback" id="bldFeedback"></div>
        </div>
        <div class="body-panel">
          <div class="body-panel-label">SAVED SEQUENCES</div>
          <div class="bld-saved-list" id="bldSavedList">
            <span class="bld-empty">No saved sequences.</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Sticky action bar -->
  <div class="body-actions">
    <button class="hud-btn hud-btn-primary" id="bldPlay"><i class="bi bi-play-fill"></i> PLAY</button>
    <button class="hud-btn hud-btn-warn" id="bldNeutral"><i class="bi bi-arrow-counterclockwise"></i> NEUTRAL</button>
  </div>
</div>
