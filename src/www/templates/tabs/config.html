<div class="tab-pane fade" id="config" role="tabpanel">
  <div class="config-wrap">
    <div class="config-header">
      <div class="config-header-left">
        <i class="bi bi-gear-fill"></i>
        <span class="config-title-full">CONFIGURATION</span>
        <span class="config-title-short">CONFIG</span>
      </div>
      <div class="config-header-actions">
        <button class="hud-btn hud-btn-primary" id="saveConfigBtn">
          <i class="bi bi-save"></i> SAVE
        </button>
        <button class="hud-btn hud-btn-ghost" id="rebootBtn" title="Reboot TARS">
          <i class="bi bi-arrow-repeat"></i> REBOOT
        </button>
      </div>
    </div>
    <div class="config-body">
      <div id="configForm">
        <div class="config-loading">
          <div class="hud-spinner"></div>
          <span>Loading configuration…</span>
        </div>
      </div>
    </div>
  </div>

  <!-- WiFi content (hidden, moved into config WiFi panel by JS) -->
  <div id="configWifiSource" style="display:none;">
    {% include 'tabs/wifi.html' %}
  </div>
</div>
