<div class="tab-pane fade" id="emotions" role="tabpanel">
  <div class="em-wrap">
    <div class="em-header">
      <span class="em-title">EYES MOOD CONTROL</span>
    </div>
    <div class="em-grid">
      <button class="em-btn" onclick="emSetMood('NEUTRAL')">  <span class="em-icon">😐</span><span>NEUTRAL</span></button>
      <button class="em-btn" onclick="emSetMood('HAPPY')">    <span class="em-icon">😊</span><span>HAPPY</span></button>
      <button class="em-btn" onclick="emSetMood('SAD')">      <span class="em-icon">😢</span><span>SAD</span></button>
      <button class="em-btn" onclick="emSetMood('ANGRY')">    <span class="em-icon">😠</span><span>ANGRY</span></button>
      <button class="em-btn" onclick="emSetMood('EXCITED')">  <span class="em-icon">🤩</span><span>EXCITED</span></button>
      <button class="em-btn" onclick="emSetMood('AFRAID')">   <span class="em-icon">😨</span><span>AFRAID</span></button>
      <button class="em-btn" onclick="emSetMood('SLEEPY')">   <span class="em-icon">😴</span><span>SLEEPY</span></button>
      <button class="em-btn" onclick="emSetMood('SIDEEYE_LEFT')"> <span class="em-icon">👈</span><span>SIDE-L</span></button>
      <button class="em-btn" onclick="emSetMood('SIDEEYE_RIGHT')"><span class="em-icon">👉</span><span>SIDE-R</span></button>
    </div>
    <p class="em-status" id="emStatus"></p>
    <div class="em-tars-logo">T.A.R.S.</div>
  </div>
</div>
