<div class="tab-pane fade" id="legs" role="tabpanel">
  <div class="servo-wrap">
    <div class="servo-header">
      <i class="bi bi-bezier2"></i> LEG CONTROLS
      <span class="live-dot"></span>
    </div>

    <div class="speed-row">
      <span class="speed-row-label"><i class="bi bi-speedometer2"></i> SPEED</span>
      <input type="range" id="speedSlider" class="hud-range" min="0.65" max="1" step="0.05" value="0.85">
    </div>

    <div class="servo-sliders">
      <div class="servo-card">
        <label class="servo-card-label">L LEG</label>
        <input type="range" id="leftLeg" class="servo-slider" min="5" max="100" step="5" value="50" oninput="updateValueDisplay(this,0)">
        <span class="servo-val" onclick="resetServo('leftLeg',0)">50</span>
      </div>
      <div class="servo-card">
        <label class="servo-card-label">L HEIGHT</label>
        <input type="range" id="leftHeight" class="servo-slider" min="5" max="100" step="5" value="50" oninput="updateValueDisplay(this,1)">
        <span class="servo-val" onclick="resetServo('leftHeight',1)">50</span>
      </div>
      <div class="servo-card">
        <label class="servo-card-label">R HEIGHT</label>
        <input type="range" id="rightHeight" class="servo-slider" min="5" max="100" step="5" value="50" oninput="updateValueDisplay(this,2)">
        <span class="servo-val" onclick="resetServo('rightHeight',2)">50</span>
      </div>
      <div class="servo-card">
        <label class="servo-card-label">R LEG</label>
        <input type="range" id="rightLeg" class="servo-slider" min="5" max="100" step="5" value="50" oninput="updateValueDisplay(this,3)">
        <span class="servo-val" onclick="resetServo('rightLeg',3)">50</span>
      </div>
    </div>

    <div class="servo-actions">
      <button class="hud-btn hud-btn-primary" onclick="applyLegControls()">EXECUTE</button>
      <button class="hud-btn hud-btn-warn"    onclick="resetAllLegs()">RESET</button>
    </div>
  </div>
</div>
