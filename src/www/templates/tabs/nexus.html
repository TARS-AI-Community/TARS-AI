<!-- ── NEXUS DASHBOARD TAB ── -->
<div class="tab-pane fade" id="nexus" role="tabpanel">
  <div class="nexus-wrap">

    <!-- Status strip -->
    <div class="nexus-status-strip">
      <div class="nexus-metric">
        <span class="nexus-metric-label">CPU</span>
        <span class="nexus-metric-value" id="nxCpu">--</span>
        <div class="nexus-metric-bar"><div class="nexus-metric-fill nexus-bar-cpu" id="nxCpuBar"></div></div>
      </div>
      <div class="nexus-metric">
        <span class="nexus-metric-label">RAM</span>
        <span class="nexus-metric-value" id="nxRam">--</span>
        <div class="nexus-metric-bar"><div class="nexus-metric-fill nexus-bar-ram" id="nxRamBar"></div></div>
      </div>
      <div class="nexus-metric">
        <span class="nexus-metric-label">TEMP</span>
        <span class="nexus-metric-value" id="nxTemp">--</span>
        <div class="nexus-metric-bar"><div class="nexus-metric-fill nexus-bar-temp" id="nxTempBar"></div></div>
      </div>
      <div class="nexus-state-badge" id="nxStateBadge">
        <span class="live-dot"></span>
        <span id="nxStateText">NEUTRAL</span>
      </div>
    </div>

    <!-- Main panels grid -->
    <div class="nexus-panels">

      <!-- System Info -->
      <div class="nexus-panel nexus-panel-sys">
        <div class="section-label"><span>System</span></div>
        <div class="nexus-sys-grid">
          <div class="nexus-sys-item">
            <span class="nexus-sys-label">Character</span>
            <span class="nexus-sys-value" id="nxCharName">--</span>
          </div>
          <div class="nexus-sys-item">
            <span class="nexus-sys-label">Uptime</span>
            <span class="nexus-sys-value" id="nxUptime">--</span>
          </div>
          <div class="nexus-sys-item">
            <span class="nexus-sys-label">Battery</span>
            <span class="nexus-sys-value" id="nxBattery">N/A</span>
          </div>
          <div class="nexus-sys-item">
            <span class="nexus-sys-label">Topics</span>
            <span class="nexus-sys-value" id="nxTopics">--</span>
          </div>
          <div class="nexus-sys-item">
            <span class="nexus-sys-label">Memories</span>
            <span class="nexus-sys-value" id="nxMemories">--</span>
          </div>
        </div>
      </div>

      <!-- Real-time console -->
      <div class="nexus-panel nexus-panel-console">
        <div class="section-label"><span>Real-time Console</span></div>
        <div class="nexus-console" id="nxConsole">
          <div class="nexus-console-line">&gt; [SYSTEM] NEXUS dashboard initialized.</div>
          <div class="nexus-console-line">&gt; [SYSTEM] Awaiting telemetry data...</div>
        </div>
      </div>

      <!-- Mood Chart -->
      <div class="nexus-panel nexus-panel-mood">
        <div class="section-label"><span>Mood Timeline</span></div>
        <div class="nexus-mood-tags" id="nxMoodTags">
          <span class="nexus-mood-tag active">NEUTRAL</span>
        </div>
        <canvas class="nexus-mood-canvas" id="nxMoodCanvas" width="400" height="120"></canvas>
        <div class="nexus-mood-legend">
          <span class="nexus-legend-item"><span class="nexus-legend-dot" style="background:var(--cyan)"></span>History</span>
        </div>
      </div>

    </div>
  </div>
</div>
