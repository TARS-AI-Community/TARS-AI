<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title id="titleid">T.A.R.S.</title>

  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}?v={{ range(1,99999)|random }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}?v={{ range(1,99999)|random }}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/main.css') }}?v={{ range(1,99999)|random }}" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='imgs/favicon.ico') }}?v={{ range(1,99999)|random }}">

  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}?v={{ range(1,99999)|random }}"></script>
  <script src="{{ url_for('static', filename='js/socket.io.js') }}?v={{ range(1,99999)|random }}"></script>
</head>

<body>
  <!-- slow-drifting nebula blobs (CSS only, behind everything) -->
  <div class="nebula-layer" aria-hidden="true">
    <div class="nebula-blob nb-1"></div>
    <div class="nebula-blob nb-2"></div>
    <div class="nebula-blob nb-3"></div>
  </div>
  <canvas id="particleBg"></canvas>
  <audio id="audioPlayer" controls hidden></audio>

  <!-- ── TAB BAR ── -->
  <nav class="tab-bar" id="myTab" role="tablist">
    <div class="tab-bar-left">
      <button class="custom-tab active" id="chat-tab"     data-bs-toggle="tab" data-bs-target="#chat"     role="tab" aria-label="Chat"><i class="bi bi-chat-dots-fill"></i></button>
      <button class="custom-tab"        id="nexus-tab"    data-bs-toggle="tab" data-bs-target="#nexus"    role="tab" aria-label="Nexus"><i class="bi bi-cpu"></i></button>
      <button class="custom-tab"        id="motion-tab"   data-bs-toggle="tab" data-bs-target="#motion"   role="tab" aria-label="Motion"><i class="bi bi-joystick"></i></button>
      <button class="custom-tab"        id="body-tab"     data-bs-toggle="tab" data-bs-target="#body"     role="tab" aria-label="Body"><i class="bi bi-person-arms-up"></i></button>
      <button class="custom-tab"        id="emotions-tab" data-bs-toggle="tab" data-bs-target="#emotions" role="tab" aria-label="Emotions"><i class="bi bi-emoji-smile"></i></button>
      <button class="custom-tab"        id="wifi-tab"     data-bs-toggle="tab" data-bs-target="#wifi"     role="tab" aria-label="WiFi"><i class="bi bi-wifi"></i></button>
      <button class="custom-tab"        id="config-tab"   data-bs-toggle="tab" data-bs-target="#config"   role="tab" aria-label="Config"><i class="bi bi-gear-fill"></i></button>
    </div>
    <div class="tab-bar-right">
      <div class="connection-indicator" id="connIndicator">
        <span class="conn-dot" id="connDot"></span>
      </div>
      <div class="tars-watermark">T.A.R.S.</div>
      <button class="custom-tab" id="fullscreen-toggle" onclick="toggleFullscreen()" aria-label="Fullscreen">
        <i class="bi bi-fullscreen" id="fullscreen-icon"></i>
      </button>
    </div>
  </nav>

  <!-- ── TAB CONTENT ── -->
  <div class="tab-content" id="myTabContent">
    <div class="swipe-track" id="swipeTrack">
      {% include 'tabs/chat.html' %}
      {% include 'tabs/nexus.html' %}
      {% include 'tabs/motion.html' %}
      {% include 'tabs/body.html' %}
      {% include 'tabs/emotions.html' %}
      {% include 'tabs/wifi.html' %}
      {% include 'tabs/config.html' %}
    </div>
  </div>

  <!-- ── MOBILE BOTTOM NAV ── -->
  <nav class="mobile-nav" id="mobileNav">
    <div class="mobile-nav-buttons">
      <button class="mobile-nav-btn active" data-tab-index="0" aria-label="Chat"><i class="bi bi-chat-dots-fill"></i><span>Chat</span></button>
      <button class="mobile-nav-btn" data-tab-index="1" aria-label="Nexus"><i class="bi bi-cpu"></i><span>Nexus</span></button>
      <button class="mobile-nav-btn" data-tab-index="2" aria-label="Motion"><i class="bi bi-joystick"></i><span>Move</span></button>
      <button class="mobile-nav-btn" data-tab-index="3" aria-label="Body"><i class="bi bi-person-arms-up"></i><span>Body</span></button>
      <button class="mobile-nav-btn" data-tab-index="4" aria-label="Emotions"><i class="bi bi-emoji-smile"></i><span>Emo</span></button>
      <button class="mobile-nav-btn" data-tab-index="5" aria-label="WiFi"><i class="bi bi-wifi"></i><span>WiFi</span></button>
      <button class="mobile-nav-btn" data-tab-index="6" aria-label="Config"><i class="bi bi-gear-fill"></i><span>Config</span></button>
    </div>
  </nav>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Flask → JS bridge -->
  <script>
    window.APP_CONFIG = {
      charName:      "{{ char_name }}",
      charGreeting:  "{{ char_greeting }}",
      port:          "{{ port }}",
      charAvatarUrl: "{{ url_for('static', filename='imgs/char.png') }}"
    };
  </script>

  <script src="{{ url_for('static', filename='js/main.js') }}?v={{ range(1,99999)|random }}"></script>
  <script src="{{ url_for('static', filename='js/particles.js') }}?v={{ range(1,99999)|random }}"></script>
</body>
</html>
