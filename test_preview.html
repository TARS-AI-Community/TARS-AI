<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TARS Preview Test</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a14; color: #ccc; font-family: monospace; display: flex; height: 100vh; }
    #sidebar { width: 200px; flex-shrink: 0; padding: 12px; border-right: 1px solid #222; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    h2 { color: #00aaff; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin: 8px 0 4px; }
    h2:first-child { margin-top: 0; }
    .mov-btn {
      background: #111; border: 1px solid #292929; color: #888; padding: 6px 8px;
      cursor: pointer; font-family: monospace; font-size: 11px; text-align: left;
      border-radius: 2px; transition: border-color 0.1s, color 0.1s;
    }
    .mov-btn:hover { border-color: #00aaff; color: #ddd; }
    .mov-btn.active { border-color: #00aaff; color: #00aaff; background: #0a1520; }
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #bldPreviewViewport { flex: 1; }
    #controls { padding: 8px 14px; display: flex; gap: 10px; border-top: 1px solid #222; align-items: center; }
    button { background: #1a2a3a; border: 1px solid #00aaff; color: #00aaff; padding: 5px 14px;
             cursor: pointer; font-family: monospace; font-size: 12px; border-radius: 2px; }
    button:hover { background: #00aaff; color: #000; }
    #movName { color: #00aaff; font-size: 12px; margin-left: 6px; }
  </style>
</head>
<body>
<div id="sidebar">

  <h2>Locomotion</h2>
  <button class="mov-btn" data-mov="walk_forward" data-loco="1">walk_forward</button>
  <button class="mov-btn" data-mov="walk_backward" data-loco="1" data-dir="-1">walk_backward</button>
  <button class="mov-btn" data-mov="step_forward" data-loco="1">step_forward</button>
  <button class="mov-btn" data-mov="step_backward" data-loco="1" data-dir="-1">step_backward</button>
  <button class="mov-btn" data-mov="turn_right" data-loco="1">turn_right</button>
  <button class="mov-btn" data-mov="turn_left" data-loco="1">turn_left</button>

  <h2>Expressive</h2>
  <button class="mov-btn" data-mov="wave_right">wave_right</button>
  <button class="mov-btn" data-mov="wave_left">wave_left</button>
  <button class="mov-btn" data-mov="swing_legs">swing_legs</button>
  <button class="mov-btn" data-mov="tilt_right">tilt_right</button>
  <button class="mov-btn" data-mov="tilt_left">tilt_left</button>
  <button class="mov-btn" data-mov="side_side">side_side</button>
  <button class="mov-btn" data-mov="laugh">laugh</button>
  <button class="mov-btn" data-mov="excited">excited</button>
  <button class="mov-btn" data-mov="bow">bow</button>
  <button class="mov-btn" data-mov="pose">pose</button>
  <button class="mov-btn" data-mov="monster">monster</button>

  <h2>Utility</h2>
  <button class="mov-btn" data-mov="neutral">neutral</button>

</div>
<div id="main">
  <div id="bldPreviewViewport"></div>
  <div id="controls">
    <button id="bldPreview">&#9654; Play</button>
    <button id="bldPreviewStop" style="display:none">&#9632; Stop</button>
    <span id="movName">&#8592; select a movement</span>
  </div>
</div>

// Normalise shorthand keys to the field names tars_preview.js expects
function normalise(steps) {
  return steps.map(function(s) {
    return {
      left_height:  s.lh !== undefined ? s.lh : (s.left_height  || 0),
      right_height: s.rh !== undefined ? s.rh : (s.right_height || 0),
      left_leg:     s.ll !== undefined ? s.ll : (s.left_leg     || 0),
      right_leg:    s.rl !== undefined ? s.rl : (s.right_leg    || 0),
      speed:        s.sp !== undefined ? s.sp : (s.speed || 0.85),
      hold_time:    s.ht !== undefined ? s.ht : (s.hold_time || 0),
    };
  });
}

var currentMovement = null;

document.querySelectorAll('.mov-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mov-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentMovement = btn.dataset.mov;
    window._bldLocomotion    = btn.dataset.loco === '1';
    window._bldLocomotionDir = btn.dataset.dir === '-1' ? -1 : 1;
    document.getElementById('movName').textContent = currentMovement;
  });
});

window._bldGetSteps = function() {
  if (!currentMovement || !MOVEMENTS[currentMovement]) return [];
  return normalise(JSON.parse(JSON.stringify(MOVEMENTS[currentMovement])));
};
